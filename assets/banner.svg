<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">BizAI — Smart Business Analytics</title>
  <desc id="desc">A revenue line draws itself, a dip is flagged in red, and a dashed forecast with a shaded range extends to the right.</desc>
  <style>
    .bg{fill:#F3EEE3}.ink{fill:#17130E}.mute{fill:#6A6155}.acc{fill:#C2380F}.pos{fill:#1F6B45}
    .rule{stroke:#17130E}.grid{stroke:#17130E;opacity:.12}
    .rev{stroke:#17130E}.exp{stroke:#6A6155}.fc{stroke:#C2380F}.band{fill:#C2380F;opacity:.16}
    @media (prefers-color-scheme:dark){
      .bg{fill:#12100D}.ink{fill:#EFE7D8}.mute{fill:#9D9385}.acc{fill:#FF6B3D}.pos{fill:#6FCB95}
      .rule,.grid,.rev{stroke:#EFE7D8}.exp{stroke:#9D9385}.fc{stroke:#FF6B3D}.band{fill:#FF6B3D}
    }
    text{font-family:Georgia,'Times New Roman',serif}
    .mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;letter-spacing:.14em}
    .rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
    .fade{animation:fade 1s ease-out both}
    .draw{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.6,0,.2,1) forwards}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
    .ring{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(28px)}}
    @keyframes fade{from{opacity:0}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pulse{50%{transform:scale(1.25)}}
    @keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
  </style>

  <rect class="bg" width="1200" height="340"/>
  <line class="rule" x1="40" y1="300" x2="1160" y2="300" stroke-width="1"/>
  <line class="rule" x1="40" y1="305" x2="1160" y2="305" stroke-width="1"/>

  <!-- Masthead line with a live dot -->
  <g class="fade">
    <circle class="pos pulse" cx="66" cy="62" r="5"/>
    <text class="mute mono" x="82" y="67" font-size="13">MONTHLY BUSINESS REVIEW · LIVE</text>
  </g>

  <!-- Title -->
  <text class="ink rise" x="56" y="168" font-size="108" font-style="italic" font-weight="800" letter-spacing="-3">BizAI<tspan class="acc">.</tspan></text>
  <text class="ink rise" x="60" y="214" font-size="25" style="animation-delay:.25s">Smart business analytics for every company,</text>
  <text class="acc rise" x="60" y="246" font-size="25" font-style="italic" style="animation-delay:.4s">every month.</text>
  <text class="mute mono fade" x="60" y="282" font-size="12" style="animation-delay:.9s">FORECASTS · RISK DETECTION · WHAT-IF · LIVE DATA</text>

  <!-- Chart -->
  <g transform="translate(0,0)">
    <line class="grid" x1="620" y1="110" x2="1160" y2="110"/>
    <line class="grid" x1="620" y1="170" x2="1160" y2="170"/>
    <line class="grid" x1="620" y1="230" x2="1160" y2="230"/>

    <polyline class="exp draw" pathLength="1" stroke-width="1.6" style="animation-delay:.3s"
      points="620,262 650,258 680,262 710,250 740,244 770,250 800,236 830,230 860,226 890,222 920,214 950,218 980,204 1010,198 1040,202 1070,188"/>
    <polyline class="rev draw" pathLength="1" style="animation-delay:.2s"
      points="620,230 650,224 680,228 710,214 740,206 770,212 800,196 830,188 860,238 890,180 920,172 950,176 980,160 1010,152 1040,156 1070,140"/>

    <polygon class="band fade" style="animation-delay:2.7s" points="1070,140 1100,122 1130,108 1160,94 1160,138 1130,144 1100,148 1070,140"/>
    <polyline class="fc fade" style="animation-delay:2.7s" fill="none" stroke-width="2.5" stroke-dasharray="7 6"
      points="1070,140 1100,135 1130,126 1160,116"/>

    <g class="fade" style="animation-delay:1.5s">
      <circle class="acc" cx="860" cy="238" r="6"/>
      <circle class="ring" cx="860" cy="238" r="6" stroke="#C2380F"/>
      <text class="acc mono" x="874" y="262" font-size="11">UNUSUAL MONTH</text>
    </g>
    <text class="acc mono fade" x="1078" y="84" font-size="11" style="animation-delay:2.9s">FORECAST</text>
  </g>
</svg>
